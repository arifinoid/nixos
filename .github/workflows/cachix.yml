name: "Cachix"
on:
  pull_request:
  push:
jobs:
  cachix:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v17
      with:
        name: arifinoid-nix
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    # pipefail: without this, `nix build ... | cachix push` always goes green
    # even when the nix build fails (the exit code used is cachix's).
    - run: |
        set -o pipefail
        nix flake check
    - run: |
        set -o pipefail
        nix build .#nixosConfigurations.wsl-arifinoid.config.system.build.toplevel --print-out-paths | cachix push arifinoid-nix
    - run: |
        set -o pipefail
        nix build .#nixosConfigurations.arifinoid.config.system.build.toplevel --print-out-paths | cachix push arifinoid-nix
